# Base de datos PostgreSQL (desarrollo local)
spring.datasource.url=jdbc:postgresql://localhost:5432/asistente_academico
# Rol acotado (solo SELECT/INSERT/UPDATE/DELETE, ver db/roles.sql): es el
# que usa JPA/Hibernate en runtime para las consultas normales del backend.
# No tiene privilegios de DDL -- por eso Flyway usa un usuario aparte (ver
# spring.flyway.user mas abajo), que sigue siendo el owner del esquema.
spring.datasource.username=${DB_APP_USER:app_academico}
spring.datasource.password=${DB_APP_PASSWORD:app_academico_dev}
spring.jpa.show-sql=true
server.port=8443

# Migraciones versionadas via Flyway. El esquema NUNCA se crea via
# ddl-auto=update; ddl-auto=validate solo verifica que las entidades JPA
# coincidan con el esquema ya aplicado por Flyway (local) o por
# db/schema.sql (contenedor Docker, ver docker-compose.yml).
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
# Datasource propio de Flyway (distinto del de arriba): las migraciones
# necesitan DDL (CREATE/ALTER TABLE), asi que corren con el rol owner del
# esquema, no con el rol acotado que usa la app en runtime.
spring.flyway.user=postgres
spring.flyway.password=BANKAI
spring.jpa.hibernate.ddl-auto=validate

spring.data.redis.host=localhost
spring.data.redis.port=6379

# OWASP A02 (fallo criptografico): TLS activado con certificado
# autofirmado para desarrollo local (ver docs/adr para justificacion
# de que un certificado real de una CA queda fuera de alcance de esta
# entrega, al no haber despliegue publico todavia).
server.ssl.enabled=true
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=asistente123
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=asistente-academico
server.ssl.enabled-protocols=TLSv1.3,TLSv1.2

# Entregas de tareas (subida de archivos): ruta de almacenamiento en disco.
# En Docker la sobreescribe ENTREGAS_STORAGE_PATH (ver docker-compose.yml,
# montado sobre el volumen entregas_data); en local sin Docker cae a
# ./entregas relativo al directorio de trabajo del proceso.
entregas.storage.path=${ENTREGAS_STORAGE_PATH:./entregas}

# Limite de tamano de archivo subido: 10MB, igual al limite que ya valida
# EntregaService. Si Spring lo rechaza antes de llegar al servicio (por
# exceder este limite a nivel de request), GlobalExceptionHandler traduce
# el MaxUploadSizeExceededException resultante a un ProblemDetail claro
# en vez de dejarlo escapar como 500.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Chatbot academico (Gemini): la clave real se inyecta por variable de
# entorno (ver .env / docker-compose.yml), NUNCA hardcodeada aca. Vacia
# por defecto para no romper el arranque en un entorno sin la clave
# configurada -- ChatbotService valida esto y devuelve un 503 con
# ProblemDetail en vez de fallar de forma confusa.
gemini.api.key=${GEMINI_API_KEY:}

# Credenciales del OWNER (postgres), exclusivas para el respaldo
# administrativo (BackupService -> pg_dump). NUNCA se usan para JPA/
# Hibernate -- eso sigue siendo spring.datasource.* (DB_APP_USER/
# DB_APP_PASSWORD, rol acotado). app_academico no tiene los privilegios
# necesarios para un pg_dump completo (confirmado: permission denied
# sobre auditoria, que le revocamos SELECT a proposito).
# Defaults de desarrollo local (mismas credenciales que ya usa
# spring.flyway.* arriba); en Docker los sobreescriben POSTGRES_USER/
# POSTGRES_PASSWORD/POSTGRES_DB (ver docker-compose.yml).
admin.backup.db.host=${DB_BACKUP_HOST:localhost}
admin.backup.db.port=${DB_BACKUP_PORT:5432}
admin.backup.db.name=${POSTGRES_DB:asistente_academico}
admin.backup.db.user=${POSTGRES_USER:postgres}
admin.backup.db.password=${POSTGRES_PASSWORD:BANKAI}

# Ruta de almacenamiento de los .dump generados por BackupService. Mismo
# criterio que entregas.storage.path: en Docker la sobreescribe
# BACKUPS_STORAGE_PATH, montado sobre el volumen backups_data.
admin.backup.storage.path=${BACKUPS_STORAGE_PATH:./backups}