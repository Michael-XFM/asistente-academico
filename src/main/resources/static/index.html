<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistente Virtual Académico — UTEQ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root{
            --bg:#F4FBF6;
            --card:#FFFFFF;
            --green:#1F9D5C;
            --green-dark:#146B3F;
            --green-pale:#E7F6EC;
            --ink:#16241C;
            --muted:#5B7165;
            --gold:#F5B942;
            --gold-dark:#8A6414;
            --error:#C0392B;
            --error-bg:#FBEAE8;
            --success:#146B3F;
            --success-bg:#E7F6EC;
        }
        *{box-sizing:border-box;}
        html,body{height:100%;}
        body{
            margin:0;
            font-family:'Inter',sans-serif;
            color:var(--ink);
            background:var(--bg);
            display:flex;
            align-items:center;
            justify-content:center;
            padding:2rem 1rem;
            position:relative;
            overflow:hidden;
        }

        /* Formas decorativas de fondo, sutiles, alusivas a burbujas de chat */
        .blob{
            position:absolute;
            border-radius:50%;
            filter:blur(2px);
            opacity:.5;
            z-index:0;
        }
        .blob-1{ width:340px; height:340px; background:radial-gradient(circle at 30% 30%, #CDEFDA, transparent 70%); top:-120px; left:-100px; }
        .blob-2{ width:280px; height:280px; background:radial-gradient(circle at 60% 40%, #FCE8BE, transparent 70%); bottom:-100px; right:-80px; }
        .blob-3{ width:160px; height:160px; background:radial-gradient(circle at 50% 50%, #CDEFDA, transparent 75%); top:55%; right:6%; }

        .wrap{
            position:relative;
            z-index:1;
            width:100%;
            max-width:400px;
        }

        .mark{
            display:flex;
            flex-direction:column;
            align-items:center;
            margin-bottom:1.6rem;
        }
        .mark svg{width:52px;height:52px;}
        .mark .name{
            margin-top:.6rem;
            font-family:'Poppins',sans-serif;
            font-weight:700;
            font-size:1rem;
            color:var(--green-dark);
            letter-spacing:.02em;
        }
        .mark .name span{ color:var(--gold-dark); }

        .card{
            background:var(--card);
            border-radius:20px;
            box-shadow:0 24px 60px rgba(20,107,63,.14);
            padding:2.4rem 2.2rem 2rem;
        }
        .card h1{
            font-family:'Poppins',sans-serif;
            font-weight:700;
            font-size:1.5rem;
            margin:0 0 .3rem;
            text-align:center;
        }
        .card .lede{
            color:var(--muted);
            font-size:.9rem;
            margin:0 0 1.8rem;
            text-align:center;
        }

        label{
            display:block;
            font-size:.78rem;
            font-weight:600;
            color:var(--ink);
            margin-bottom:.4rem;
        }
        .field{margin-bottom:1.1rem; position:relative;}
        .field .icon{
            position:absolute;
            left:.85rem;
            top:2.15rem;
            width:16px;
            height:16px;
            color:#9DB2A6;
            pointer-events:none;
        }
        input{
            width:100%;
            border:1.5px solid #E1EBE4;
            border-radius:10px;
            background:#FBFDFB;
            padding:.72rem .85rem .72rem 2.5rem;
            font-family:'Inter',sans-serif;
            font-size:.95rem;
            color:var(--ink);
            outline:none;
            transition:border-color .15s ease, background .15s ease;
        }
        input::placeholder{color:#A8B8AE;}
        input:focus{border-color:var(--green); background:#fff;}
        input:-webkit-autofill,
        input:-webkit-autofill:hover,
        input:-webkit-autofill:focus{
            -webkit-box-shadow:0 0 0 1000px #FBFDFB inset;
            -webkit-text-fill-color:var(--ink);
            transition:background-color 999999s ease-in-out 0s;
        }

        button.submit{
            width:100%;
            background:linear-gradient(135deg, var(--green), var(--green-dark));
            color:#fff;
            border:none;
            border-radius:10px;
            padding:.85rem 1rem;
            font-family:'Poppins',sans-serif;
            font-size:.95rem;
            font-weight:600;
            cursor:pointer;
            margin-top:.3rem;
            transition:filter .15s ease, transform .1s ease;
        }
        button.submit:hover{filter:brightness(1.06);}
        button.submit:active{transform:scale(.99);}
        button.submit:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

        #mensaje{
            display:none;
            font-size:.85rem;
            padding:.65rem .85rem;
            border-radius:8px;
            margin-bottom:1.1rem;
            background:var(--error-bg);
            color:var(--error);
            border:1px solid rgba(192,57,43,.2);
        }
        #mensaje.success{
            background:var(--success-bg);
            color:var(--success);
            border:1px solid rgba(20,107,63,.2);
        }

        .links{
            margin-top:1.3rem;
            display:flex;
            justify-content:space-between;
            font-size:.83rem;
        }
        .links a{color:var(--muted); text-decoration:none;}
        .links a:hover{color:var(--green-dark); text-decoration:underline;}

        .switch{
            margin-top:1.6rem;
            font-size:.87rem;
            color:var(--muted);
            text-align:center;
        }
        .switch a{color:var(--green-dark);font-weight:600;text-decoration:none;}
        .switch a:hover{text-decoration:underline;}

        @media (max-width:480px){
            .card{padding:2rem 1.4rem 1.8rem;}
        }
    </style>
</head>
<body>

<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<div class="blob blob-3"></div>

<main class="wrap">
    <div class="mark">
        <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M32 10 58 21 32 32 6 21 32 10Z" fill="#1F9D5C"/>
            <path d="M17 26v10c0 4 7 8 15 8s15-4 15-8V26" stroke="#146B3F" stroke-width="2.4" stroke-linecap="round"/>
            <circle cx="54" cy="24" r="2.2" fill="#146B3F"/>
            <path d="M54 24v9" stroke="#146B3F" stroke-width="2" stroke-linecap="round"/>
            <rect x="20" y="42" width="24" height="15" rx="7.5" fill="#F5B942"/>
            <circle cx="27" cy="49.5" r="1.6" fill="#7A5A0E"/>
            <circle cx="32" cy="49.5" r="1.6" fill="#7A5A0E"/>
            <circle cx="37" cy="49.5" r="1.6" fill="#7A5A0E"/>
        </svg>
        <div class="name">Asistente Virtual <span>Académico</span></div>
    </div>

    <div class="card">
        <h1>Iniciar sesión</h1>
        <p class="lede">Ingresa con tu correo institucional.</p>

        <div id="mensaje" role="alert"></div>

        <div class="field">
            <label for="email">Correo electrónico</label>
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3.5 6.5 12 13l8.5-6.5"/></svg>
            <input type="email" id="email" placeholder="usuario@uteq.edu.ec" autocomplete="username">
        </div>
        <div class="field">
            <label for="contrasena">Contraseña</label>
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>
            <input type="password" id="contrasena" placeholder="••••••••" autocomplete="current-password">
        </div>

        <button class="submit" onclick="login()">Entrar</button>

        <div class="links">
            <a href="registro.html">¿No tienes cuenta?</a>
            <a href="#" id="forgot">¿Olvidaste tu contraseña?</a>
        </div>
    </div>
</main>

<script>
    async function login() {
        const email = document.getElementById('email').value;
        const contrasena = document.getElementById('contrasena').value;
        const mensaje = document.getElementById('mensaje');

        try {
            const response = await fetch('https://localhost:8443/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, contrasena })
            });

            const data = await response.json();

            if (response.ok) {
                localStorage.setItem('token', data.token);
                localStorage.setItem('nombre', data.nombre);
                localStorage.setItem('rol', data.rol);

                if (data.rol === 'ADMIN') {
                    window.location.href = 'admin.html';
                } else if (data.rol === 'PROFESOR') {
                    window.location.href = 'profesor.html';
                } else {
                    window.location.href = 'dashboard.html';
                }
            } else {
                mensaje.style.display = 'block';
                mensaje.className = '';
                mensaje.textContent = data.detail || 'No se pudo iniciar sesión.';
            }
        } catch (error) {
            mensaje.style.display = 'block';
            mensaje.className = '';
            mensaje.textContent = 'Error de conexión con el servidor.';
        }
    }

    document.getElementById('contrasena').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') login();
    });
</script>
</body>
</html>
